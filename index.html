    <link rel="alternate" hreflang="en" href="https://sanket-swart.vercel.app/" />

    <link rel="alternate" hreflang="te" href="https://sanket-swart.vercel.app/?lang=te" />
    <link rel="alternate" hreflang="x-default" href="https://sanket-swart.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SANKET" />
    <meta property="og:url" content="https://sanket-swart.vercel.app/" />

    <script type="application/ld+json">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Archivo (Latin), the hero face, is fetched alongside the CSS rather than after first layout, so
         the desktop hero never paints in the fallback and then swaps (that swap moved the headline,
         CLS ~0.03). Phones skip it: there it would compete with the app's JS on a slow link. The fonts
         are self-hosted (src/styles/fonts.css); Vite fingerprints this file to the same URL the CSS uses. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
      media="(min-width: 700px)"
    />
