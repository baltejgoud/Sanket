    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo (latin), the hero face, fetched alongside the CSS rather than after first layout:
         on desktop the hero then never paints in the fallback and swaps (that swap moved the
         headline, CLS ~0.03). Phones skip it, where it would compete with the app's JS on a slow
         link and the font lands before first render anyway. This is the file Google's CSS serves
         for Archivo v25; scripts/check-site.mjs fails if that changes. -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/archivo/v25/k3kQo8UDI-1M0wlSfdnoLg.woff2"
      as="font"
      type="font/woff2"
      crossorigin
      media="(min-width: 700px)"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Tiro+Devanagari+Hindi&family=Tiro+Telugu&display=swap"
      rel="stylesheet"
    />
  </head>

      </p>
